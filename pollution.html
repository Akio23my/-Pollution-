<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OceanWatch - Cleanup Simulation</title>
<link rel="stylesheet" href="pollution.css">
<script src="pollution.js" defer></script>
</head>
<body>
<canvas id="ocean" aria-label="Ocean pollution cleanup simulation"></canvas>
<header class="background" id="background">
  <span class="rivet tl"></span><span class="rivet tr"></span>
  <div class="brand">
    <span class="eyebrow">OceanWatch // Console</span>
    <h1>Cleanup Simulation</h1>
    <span class="sub">Autonomous vessel - live water survey</span>
  </div>
  <div class="stats">
    <div class="meter-wrap">
      <div class="meter" id="meter"><span id="meterLabel">0%</span></div>
      <div class="meter" style="min-width:70px;">
        <div class="label">Water clarity</div>
      </div>
    </div>
    <div class="stat collected">
      <div class="label">Plastic collected</div>
      <div class="value" id="collectedvalue">0</div>
    </div>
    <div class="stat remaining">
      <div class="label">Remaining pollution</div>
      <div class="value" id="remainvalue">0</div>
    </div>
  </div>
  <div class="controls">
    <div class="control">
      <span class="ctl-label">Simulation speed <b id="speedOut">1.0×</b></span>
      <input type="range" id="speedSlider" min="0.25" max="3" step="0.05" value="1">
    </div>
    <div class="control">
      <span class="ctl-label">Pollution rate <b id="rateOut">1.5/s</b></span>
      <input type="range" id="rateSlider" min="0" max="6" step="0.1" value="1.5">
    </div>
  </div>
</header>
<div class="hint" id="hint">Move the mouse to steer · <b>Arrow keys</b> nudge the boat · Touch &amp; drag on mobile</div>
</body>
</html>
